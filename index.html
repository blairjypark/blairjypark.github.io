<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>음식물 쓰레기 제로</title>
<style>
  :root {
    --sea-blue: #1194ca;
    --soft-blue: #dff3fb;
    --line: #d7d7d7;
    --green-crayon: rgba(125, 184, 74, 0.72);
    --red-crayon: #c84646;
    --paper: #fbfbf7;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #eef7fb;
    font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 16px;
    color: #333;
  }

.sheet {
  width: min(1040px, 100%);
  background: var(--paper);
  position: relative;
  overflow: hidden;
  border-radius: 24px;
}

  .top-wave {
    position: relative;
    height: 170px;
    background: linear-gradient(#d9f2fb, #f9fcfd 78%);
    border-bottom: 1px solid #cfdce2;
  }

  .top-wave::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 48px;
    background:
      radial-gradient(circle at 5% 100%, transparent 28px, #9bd6ea 29px, #9bd6ea 48px, transparent 49px),
      radial-gradient(circle at 18% 100%, transparent 34px, #9bd6ea 35px, #9bd6ea 55px, transparent 56px),
      radial-gradient(circle at 36% 100%, transparent 27px, #9bd6ea 28px, #9bd6ea 48px, transparent 49px),
      radial-gradient(circle at 58% 100%, transparent 34px, #9bd6ea 35px, #9bd6ea 56px, transparent 57px),
      radial-gradient(circle at 82% 100%, transparent 30px, #9bd6ea 31px, #9bd6ea 50px, transparent 51px);
    opacity: 0.55;
  }

  .title {
    position: absolute;
    top: 22px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(36px, 6vw, 66px);
    line-height: 1;
    font-weight: 900;
    letter-spacing: -0.08em;
    color: #0485bf;
    text-shadow: 0 2px 0 rgba(255,255,255,0.8);
  }

  .subtitle {
    position: absolute;
    left: 50%;
    bottom: 11px;
    transform: translateX(-50%);
    background: #14a4d6;
    color: white;
    padding: 9px 36px;
    border-radius: 999px;
    font-weight: 800;
    font-size: clamp(15px, 2.5vw, 24px);
    white-space: nowrap;
  }

  .deco {
    position: absolute;
    pointer-events: none;
    user-select: none;
  }

  .jelly-top-left {
    top: 18px;
    left: 52px;
    font-size: 58px;
    transform: rotate(-8deg);
  }

  .crab-top-right {
    top: 20px;
    right: 46px;
    font-size: 55px;
    transform: rotate(8deg);
  }

  .coral-top {
    right: 155px;
    bottom: 0;
    font-size: 55px;
  }

  .calendar-wrap {
    padding: 0 34px 20px;
    background: linear-gradient(90deg, #e3f5fc 0 72px, transparent 72px calc(100% - 72px), #e3f5fc calc(100% - 72px));
    position: relative;
  }

  table.calendar {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    background: rgba(255,255,255,0.72);
  }

  .calendar th {
    height: 48px;
    color: #333;
    font-weight: 800;
    font-size: 18px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.72);
  }

  .calendar td {
    height: 118px;
    border: 1px solid var(--line);
    vertical-align: top;
    position: relative;
    background: rgba(255,255,255,0.58);
    overflow: visible;
  }

  .date-number {
    position: absolute;
    top: 10px;
    left: 12px;
    font-size: 21px;
    font-weight: 800;
    color: #222;
  }

  .calendar td:nth-child(1) .date-number {
    color: #c82f3d;
  }

  .calendar td:nth-child(7) .date-number {
    color: #146fb1;
  }

  .empty {
    background: rgba(255,255,255,0.28) !important;
  }

.success-heart {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -42%);
  width: 24px;
  height: 22px;
  cursor: pointer;
  border: none;
  background: transparent;
  outline: none;
}

.success-heart::before,
.success-heart::after {
  content: "";
  position: absolute;
  width: 14px;
  height: 22px;
  background: rgba(236, 98, 126, 0.72);
  border-radius: 14px 14px 0 0;
  top: 0;
}

.success-heart::before {
  left: 11px;
  transform: rotate(-45deg);
  transform-origin: 0 100%;
}

.success-heart::after {
  left: 0;
  transform: rotate(45deg);
  transform-origin: 100% 100%;
}

.success-heart:hover {
  transform: translate(-50%, -42%);
}
  .preview {
    pointer-events: none;
    display: none;
    position: absolute;
    left: 56%;
    top: 34px;
    z-index: 20;
    width: 250px;
    padding: 8px;
    background: white;
    border: 2px solid #b7deec;
    border-radius: 14px;
    box-shadow: 0 12px 26px rgba(0,0,0,0.22);
  }

  .preview img {
    display: block;
    width: 100%;
    max-height: 300px;
    object-fit: contain;
    border-radius: 10px;
  }

  .calendar td:first-child .preview {
    left: 12px;
  }

  .calendar td:last-child .preview {
    left: auto;
    right: 12px;
  }



  .notice {
    min-height: 74px;
    border-top: 1px solid #d7e5eb;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 16px;
    text-align: center;
    font-size: clamp(15px, 2vw, 20px);
    font-weight: 700;
    line-height: 1.65;
    background: rgba(255,255,255,0.68);
  }

  .bottom-sea {
    position: relative;
    height: 108px;
    background: #dff3fb;
    overflow: hidden;
    border-top: 1px solid #cfe6ee;
  }

  .bottom-sea::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: -18px;
    height: 36px;
    background:
      radial-gradient(circle at 8% 100%, #dff3fb 0 28px, transparent 29px),
      radial-gradient(circle at 24% 100%, #dff3fb 0 34px, transparent 35px),
      radial-gradient(circle at 47% 100%, #dff3fb 0 28px, transparent 29px),
      radial-gradient(circle at 68% 100%, #dff3fb 0 36px, transparent 37px),
      radial-gradient(circle at 91% 100%, #dff3fb 0 31px, transparent 32px);
  }

  .school {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 26px;
    text-align: center;
    font-size: 18px;
    font-weight: 800;
    color: #333;
  }

  .coral-left {
    left: 28px;
    bottom: 12px;
    font-size: 70px;
  }

  .jelly-bottom {
    left: 160px;
    bottom: 11px;
    font-size: 68px;
  }

  .turtle {
    right: 225px;
    bottom: 23px;
    font-size: 48px;
  }

  .crab-bottom {
    right: 115px;
    bottom: 18px;
    font-size: 46px;
  }

  .treasure {
    right: 28px;
    bottom: 5px;
    font-size: 70px;
  }

.image-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 20px;
}

.image-modal.open {
  display: flex;
}

.image-modal img {
  max-width: 92vw;
  max-height: 82vh;
  border-radius: 18px;
  background: white;
  object-fit: contain;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.image-modal-close {
  position: absolute;
  top: 18px;
  right: 22px;
  border: none;
  background: rgba(255,255,255,0.9);
  width: 42px;
  height: 42px;
  border-radius: 999px;
  font-size: 24px;
  cursor: pointer;
}

@media (max-width: 720px) {
  body {
    padding: 10px;
  }

  .calendar-wrap {
    padding: 0 8px 10px;
    background: var(--paper);
  }

  .sheet {
    width: 100%;
    min-width: 0;
  }

  .preview {
    display: none !important;
  }
}

</style>
</head>
<body>
  <main class="sheet">
    <header class="top-wave">
      <div class="deco jelly-top-left">🪼</div>
      <div class="deco coral-top">🪸</div>
      <div class="deco crab-top-right">🦀</div>
      <div class="title">음식물 쓰레기 제로</div>
      <div class="subtitle">매일매일 음식물 남기지 않기 도전!</div>
    </header>

    <section class="calendar-wrap">
      <table class="calendar" aria-label="음식물 쓰레기 제로 달력">
        <thead>
          <tr>
            <th>일</th>
            <th>월</th>
            <th>화</th>
            <th>수</th>
            <th>목</th>
            <th>금</th>
            <th>토</th>
          </tr>
        </thead>
        <tbody id="calendar-body"></tbody>
      </table>

      <div class="notice">
        * 음식을 남기지 않고 지구사랑을 실천한 날에는 표시를 해주세요!<br />
        (동그라미, 하트 등 무엇이든 괜찮아요. ^_^)
      </div>
    </section>

    <footer class="bottom-sea">
      <div class="deco coral-left">🪸</div>
      <div class="deco jelly-bottom">🪼</div>
      <div class="deco turtle">🐢</div>
      <div class="deco crab-bottom">🦀</div>
      <div class="deco treasure">🪙</div>
      <div class="school">포일성모유치원</div>
    </footer>
  </main>

<div class="image-modal" id="image-modal">
  <button class="image-modal-close" id="image-modal-close">×</button>
  <img id="modal-image" src="" alt="확대 이미지" />
</div>

<script>
const modal = document.getElementById("image-modal");
const modalImage = document.getElementById("modal-image");
const modalClose = document.getElementById("image-modal-close");

function openModal(imageUrl) {
  modalImage.src = imageUrl;
  modal.classList.add("open");
}

function closeModal() {
  modal.classList.remove("open");
  modalImage.src = "";
}

modal.addEventListener("click", (e) => {
  if (e.target === modal) {
    closeModal();
  }
});

modalClose.addEventListener("click", closeModal);
  const calendarConfig = {
    year: 2026,
    month: 5,
    imageBasePath: "/images",
    imageExtensions: ["jpg"]
  };

async function loadUploadedImages() {

  const imageMap = {};

  const baseUrl = "https://blairjypark.github.io/images/";

  const extensions = ["JPG"];

  const year = calendarConfig.year;
  const month = calendarConfig.month;

  const lastDate = new Date(year, month, 0).getDate();

  for (let day = 1; day <= lastDate; day++) {

    const dateKey =
      `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

    for (const ext of extensions) {

      const imageUrl = `${baseUrl}${dateKey}.${ext}`;

      try {

        const response = await fetch(imageUrl, {
          method: "HEAD"
        });

        if (response.ok) {

          imageMap[dateKey] = imageUrl;

          break;
        }

      } catch (e) {

        console.log("이미지 확인 실패:", imageUrl);
      }
    }
  }

  return imageMap;
}

  function toDateKey(year, month, day) {
    return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
  }

function createPreview(imageUrl) {
  const heart = document.createElement("button");
  heart.className = "success-heart";
  heart.type = "button";
  heart.setAttribute("aria-label", "성공 이미지 보기");

  heart.addEventListener("click", () => {
    openModal(imageUrl);
  });

  const preview = document.createElement("div");
  preview.className = "preview";

  const img = document.createElement("img");
  img.src = imageUrl;
  img.alt = "음식물 남기지 않기 인증 이미지";

  preview.appendChild(img);

  return [heart, preview];
}

  function createCalendar(year, month, uploadedImages) {
    const tbody = document.getElementById("calendar-body");
    tbody.innerHTML = "";

    const firstDay = new Date(year, month - 1, 1).getDay();
    const lastDate = new Date(year, month, 0).getDate();

    let row = document.createElement("tr");

    for (let i = 0; i < firstDay; i++) {
      const td = document.createElement("td");
      td.className = "empty";
      row.appendChild(td);
    }

    for (let day = 1; day <= lastDate; day++) {
      const td = document.createElement("td");
      const dateKey = toDateKey(year, month, day);

      const dateNumber = document.createElement("div");
      dateNumber.className = "date-number";
      dateNumber.textContent = day;
      td.appendChild(dateNumber);

      if (uploadedImages[dateKey]) {
        const [heart, preview] = createPreview(uploadedImages[dateKey]);
        td.appendChild(heart);
        td.appendChild(preview);
      }

      row.appendChild(td);

      if ((firstDay + day) % 7 === 0) {
        tbody.appendChild(row);
        row = document.createElement("tr");
      }
    }

    while (row.children.length > 0 && row.children.length < 7) {
      const td = document.createElement("td");
      td.className = "empty";
      row.appendChild(td);
    }

    if (row.children.length > 0) {
      tbody.appendChild(row);
    }
  }

(async () => {
  const uploadedImages = await loadUploadedImages();

  createCalendar(
    calendarConfig.year,
    calendarConfig.month,
    uploadedImages
  );
})();

</script>
</body>
</html>
